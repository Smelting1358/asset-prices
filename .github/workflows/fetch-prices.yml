name: Fetch Daily Prices

on:
  schedule:
    # KST 17:30 = UTC 08:30 (한국 장 마감 15:30 + 2시간 여유)
    # 미국 시장은 전일 데이터까지만 들어옴(실시간 X). 일봉 용도라 충분.
    - cron: "30 8 * * 1-5"
    # 미국 장 마감 후도 한 번 (UTC 22:30 = ET 17:30/18:30)
    - cron: "30 22 * * 1-5"
  workflow_dispatch:  # 수동 실행 버튼

permissions:
  contents: write  # 커밋 권한

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -U pip
          pip install yfinance

      - name: Fetch prices
        run: python scripts/fetch_prices.py

      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/prices.json
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git commit -m "chore: update prices $(date -u +%Y-%m-%d)"
          git push
